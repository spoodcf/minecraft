name: Build TI-84 Plus CE Program
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CE C/C++ Toolchain
        run: |
          wget -q https://github.com
          unzip -q CEdev-Linux.zip -d /opt
          echo "/opt/CEdev/bin" >> $GITHUB_PATH

      - name: Compile
        run: make

      - name: Upload Built Files
        uses: actions/upload-artifact@v4
        with:
          name: ti84-game-files
          path: bin/*.8x*
