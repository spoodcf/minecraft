name: Build TI-84 Plus CE Program
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CE C/C++ Toolchain
        run: |
          URL=$(curl -s https://github.com | grep "browser_download_url.*Linux.*\.tar\.gz" | cut -d '"' -f 4 | head -n 1)
          echo "Downloading $URL"
          wget -q "$URL" -O CEdev.tar.gz
          tar -xzf CEdev.tar.gz -C /opt
          echo "/opt/CEdev/bin" >> $GITHUB_PATH

      - name: Compile
        run: make

      - name: Upload Built Files
        uses: actions/upload-artifact@v4
        with:
          name: ti84-game-files
          path: bin/*.8x*
